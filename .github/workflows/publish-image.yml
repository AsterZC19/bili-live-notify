name: 发布容器镜像

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_dockerhub:
        description: "同时发布到 Docker Hub（需要配置仓库变量和 Secrets）"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: 构建并发布多架构镜像
    runs-on: ubuntu-latest
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
      # Tag push 默认发布 Docker Hub；手动运行需要显式勾选。
      DOCKERHUB_IMAGE: ${{ (github.event_name == 'push' || inputs.publish_dockerhub == true) && vars.DOCKERHUB_IMAGE || '' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 检查 Docker Hub 配置
        if: env.DOCKERHUB_IMAGE != ''
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo '已设置 DOCKERHUB_IMAGE，但缺少 DOCKERHUB_USERNAME 或 DOCKERHUB_TOKEN。' >&2
            exit 1
          fi

      - name: 登录 Docker Hub
        if: env.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成 GHCR 标签和元数据
        id: meta-ghcr
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-

      - name: 生成 Docker Hub 标签和元数据
        id: meta-dockerhub
        if: env.DOCKERHUB_IMAGE != ''
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-

      - name: 构建并发布镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta-ghcr.outputs.tags }}
            ${{ steps.meta-dockerhub.outputs.tags }}
          labels: |
            ${{ steps.meta-ghcr.outputs.labels }}
            ${{ steps.meta-dockerhub.outputs.labels }}
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container
          provenance: mode=max
          sbom: true
